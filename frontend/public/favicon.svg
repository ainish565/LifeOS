<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D4BD8"/>
      <stop offset="0.55" stop-color="#C2418F"/>
      <stop offset="1" stop-color="#F29A3A"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE7B8" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFE7B8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Badge -->
  <rect width="32" height="32" rx="9" fill="url(#bg)"/>
  <rect width="32" height="32" rx="9" fill="url(#shine)"/>

  <!-- Mark: orbit ring, planet in the gap, spark of life at the centre -->
  <g transform="translate(4 4)">
    <circle cx="12" cy="12" r="6" fill="url(#glow)"/>
    <path d="M12 3.5A8.5 8.5 0 1 1 4.64 7.75" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="7.75" cy="4.64" r="1.8" fill="#fff"/>
    <path d="M12 7.6C12.45 10.35 13.65 11.55 16.4 12C13.65 12.45 12.45 13.65 12 16.4C11.55 13.65 10.35 12.45 7.6 12C10.35 11.55 11.55 10.35 12 7.6Z" fill="#fff"/>
  </g>
</svg>
