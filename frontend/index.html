<!DOCTYPE html>
<html lang="en" data-theme="lavender" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Life OS — Personal Productivity & Life Management System." />
    <title>Life OS — Workspace</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply saved theme + mode before first paint (mirrors ThemeContext) to avoid a flash
      (function () {
        var themes = ['lavender', 'sage', 'sky', 'rose', 'peach', 'indigo'];
        var theme = null, mode = null;
        try {
          theme = localStorage.getItem('lifeos-theme');
          mode = localStorage.getItem('lifeos-mode');
        } catch (e) {}
        if (themes.indexOf(theme) === -1) theme = 'lavender';
        if (mode !== 'light' && mode !== 'dark') {
          mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-mode', mode);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
